# 生产环境配置

# 继承默认配置
extends: "default.yaml"

# 覆盖特定配置
system:
  debug: false

api:
  host: "0.0.0.0"
  port: 8000
  workers: 8

logging:
  level: "INFO"
  file: "logs/prod.log"

database:
  type: "postgresql"
  host: "${DB_HOST}"
  port: 5432
  name: "${DB_NAME}"
  user: "${DB_USER}"
  password: "${DB_PASSWORD}"
