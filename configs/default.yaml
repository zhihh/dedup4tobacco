# 默认配置文件

# 系统配置
system:
  name: "智能文档去重系统"
  version: "1.0.0"
  debug: false

# API配置
api:
  host: "0.0.0.0"
  port: 8000
  workers: 4

# 数据库配置
database:
  type: "sqlite"
  path: "data/databases/documents.db"
  pool_size: 10
  max_overflow: 20

# 向量存储配置
vector_store:
  type: "chroma"
  host: "localhost"
  port: 8001
  collection_name: "documents"

# LLM配置
llm:
  provider: "openai"
  model: "gpt-4"
  api_key: "${OPENAI_API_KEY}"
  temperature: 0.1
  max_tokens: 1000

# 嵌入配置
embedding:
  provider: "openai"
  model: "text-embedding-3-large"
  api_key: "${OPENAI_API_KEY}"
  batch_size: 100
  cache_enabled: true

# 聚类配置
clustering:
  algorithm: "hierarchical"
  threshold: 0.3
  min_cluster_size: 2
  max_cluster_size: 100

# 检测配置
detection:
  similarity_threshold: 0.8
  confidence_threshold: 0.7
  max_retries: 3

# 日志配置
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/app.log"
  max_size: "10MB"
  backup_count: 5
